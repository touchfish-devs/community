name: 功能建议
description: 提出新功能或改进建议
title: "[功能建议] "
labels: ["Feature"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！提交前请先搜索是否已有相似的 issue。

  - type: input
    id: software
    attributes:
      label: 软件
      description: 该建议针对哪个软件 / 项目 / 模块？
      placeholder: 例如：TouchFish Client
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 需要的功能
      description: 你希望增加什么功能？它解决什么问题？
      placeholder: 描述期望的功能、使用场景和它能带来的价值
    validations:
      required: true

  - type: textarea
    id: remarks
    attributes:
      label: 备注
      description: 可补充参考链接、界面草图、替代方案等（选填）
    validations:
      required: false
